{% extends "base.html" %}
{% block title %}RSVP: {{ event.name }}{% endblock %}
{% block content %}
<h1>{{ event.name }}</h1>
<p>Will you be there?</p>

{% if errors %}
<ul class="error">
    {% for e in errors %}<li>{{ e }}</li>{% endfor %}
</ul>
{% endif %}

<form method="post" action="/rsvp/{{ event.slug }}">
    <label for="name">Your name</label>
    <input type="text" id="name" name="name" value="{{ form.name if form else '' }}" required>

    <div class="radios">
        <label><input type="radio" name="response" value="Yes"
            {% if form and form.response == 'Yes' %}checked{% endif %}> Yes</label>
        <label><input type="radio" name="response" value="Maybe"
            {% if form and form.response == 'Maybe' %}checked{% endif %}> Maybe</label>
        <label><input type="radio" name="response" value="No"
            {% if form and form.response == 'No' %}checked{% endif %}> No</label>
    </div>

    <label for="phone">Phone number <small>(required if Yes or Maybe)</small></label>
    <input type="tel" id="phone" name="phone" value="{{ form.phone if form else '' }}">

    <button type="submit">Submit RSVP</button>
</form>
{% endblock %}
