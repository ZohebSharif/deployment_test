# Reverse proxy in front of the FastAPI app.
# Terminates client connections, forwards to the app on port 8000.

upstream rsvp_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    # Don't let a slow/huge upload tie things up forever.
    client_max_body_size 1m;

    # Health check handled by the app; keep it lightweight and unlogged.
    location = /health {
        access_log off;
        proxy_pass http://rsvp_app;
    }

    location / {
        proxy_pass http://rsvp_app;
        proxy_http_version 1.1;

        # Pass real client info through to the app.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
