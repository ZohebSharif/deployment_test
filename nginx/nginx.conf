# Serves the built React app and proxies API calls to FastAPI on port 8000.

upstream rsvp_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't let a slow/huge upload tie things up forever.
    client_max_body_size 1m;

    # Health check handled by the app; keep it lightweight and unlogged.
    location = /health {
        access_log off;
        proxy_pass http://rsvp_app;
    }

    location /api/ {
        proxy_pass http://rsvp_app;
        proxy_http_version 1.1;

        # Pass real client info through to the app. $http_host (not $host)
        # keeps the port.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is the SPA: serve the file if it exists,
    # otherwise index.html and let React Router handle the route.
    location / {
        try_files $uri /index.html;
    }
}
