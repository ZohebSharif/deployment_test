<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}RSVP{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0c13;
            --surface: rgba(255, 255, 255, .045);
            --surface-2: rgba(255, 255, 255, .08);
            --border: rgba(255, 255, 255, .09);
            --text: #eef0f8;
            --muted: #9aa3b8;
            --violet: #8b5cf6;
            --pink: #ec4899;
            --yes: #34d399;
            --maybe: #fbbf24;
            --no: #f87171;
            --radius: 16px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.55;
        }
        /* Ambient gradient glows behind everything. */
        .bg-glow {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(600px 400px at 15% -10%, rgba(139, 92, 246, .30), transparent 70%),
                radial-gradient(700px 500px at 110% 15%, rgba(236, 72, 153, .18), transparent 70%),
                radial-gradient(800px 600px at 50% 120%, rgba(59, 130, 246, .14), transparent 70%);
        }
        .site-header {
            max-width: 720px;
            margin: 0 auto;
            padding: 1.25rem 1.25rem .25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .site-header form { margin: 0; }
        .brand {
            display: flex;
            align-items: center;
            gap: .5rem;
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: -.02em;
            color: var(--text);
            text-decoration: none;
        }
        .brand-mark { filter: drop-shadow(0 0 12px rgba(236, 72, 153, .55)); }
        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 1rem 1.25rem 4rem;
        }

        h1 {
            font-size: clamp(1.6rem, 4vw, 2.1rem);
            font-weight: 800;
            letter-spacing: -.03em;
            margin: .35rem 0 .5rem;
        }
        h3 { margin: 0; font-size: 1.1rem; font-weight: 700; letter-spacing: -.01em; }
        a { color: #c4b5fd; }
        .eyebrow {
            margin: 1.25rem 0 0;
            font-size: .72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .18em;
            background: linear-gradient(135deg, var(--violet), var(--pink));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .lead { color: var(--muted); margin: 0 0 .5rem; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-top: 1.25rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        label { display: block; margin: 1.1rem 0 .35rem; font-weight: 600; font-size: .9rem; }
        label small { color: var(--muted); font-weight: 400; }
        input[type=text], input[type=tel] {
            width: 100%;
            padding: .7rem .9rem;
            font: inherit;
            color: var(--text);
            background: rgba(0, 0, 0, .28);
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        input[type=text]:focus, input[type=tel]:focus {
            border-color: var(--violet);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, .25);
        }
        input::placeholder { color: var(--muted); }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .4rem;
            padding: .65rem 1.25rem;
            font: inherit;
            font-weight: 600;
            font-size: .95rem;
            color: var(--text);
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: transform .12s, box-shadow .15s, background .15s, border-color .15s, color .15s;
        }
        .btn:hover { transform: translateY(-1px); border-color: rgba(255, 255, 255, .22); }
        .btn-primary {
            background: linear-gradient(135deg, var(--violet), var(--pink));
            border: none;
            color: #fff;
            box-shadow: 0 8px 24px rgba(139, 92, 246, .35);
        }
        .btn-primary:hover { box-shadow: 0 10px 28px rgba(236, 72, 153, .40); }
        .btn-ghost { background: transparent; color: var(--muted); }
        .btn-ghost:hover { color: var(--text); }
        .btn-danger {
            background: rgba(248, 113, 113, .10);
            border-color: rgba(248, 113, 113, .25);
            color: var(--no);
        }
        .btn-sm { padding: .4rem .85rem; font-size: .85rem; }

        .error {
            margin-top: 1.25rem;
            padding: .75rem 1rem;
            background: rgba(248, 113, 113, .10);
            border: 1px solid rgba(248, 113, 113, .30);
            border-radius: 10px;
            color: var(--no);
        }
        .error ul { margin: 0; padding-left: 1.1rem; }

        .form-row { display: flex; gap: .6rem; flex-wrap: wrap; }
        .form-row input { flex: 1 1 200px; }

        /* Account picker chips */
        .names { display: flex; flex-wrap: wrap; gap: .6rem; }
        .names form { margin: 0; }
        .chip {
            padding: .55rem 1.15rem;
            font: inherit;
            font-weight: 600;
            color: var(--text);
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 999px;
            cursor: pointer;
            transition: border-color .15s, background .15s, transform .12s;
        }
        .chip:hover {
            transform: translateY(-1px);
            border-color: var(--violet);
            background: rgba(139, 92, 246, .18);
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.4rem 0 1.1rem;
            color: var(--muted);
            font-size: .85rem;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* Invite cards */
        .invite-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .date { color: var(--muted); font-size: .8rem; white-space: nowrap; }
        .badges { display: flex; flex-wrap: wrap; gap: .5rem; margin: .8rem 0; }
        .badge {
            padding: .22rem .7rem;
            border-radius: 999px;
            font-size: .8rem;
            font-weight: 700;
        }
        .badge.yes   { background: rgba(52, 211, 153, .13);  color: var(--yes); }
        .badge.maybe { background: rgba(251, 191, 36, .13);  color: var(--maybe); }
        .badge.no    { background: rgba(248, 113, 113, .13); color: var(--no); }
        .invite-actions {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            align-items: center;
            margin-top: .25rem;
        }
        .invite-actions form { margin: 0; }
        .empty { text-align: center; color: var(--muted); }

        /* RSVP answer choices */
        .choices {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: .6rem;
        }
        .choice { position: relative; margin: 0; }
        .choice input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        .choice span {
            display: block;
            padding: .75rem .5rem;
            text-align: center;
            font-weight: 600;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: border-color .15s, background .15s, color .15s;
        }
        .choice.yes   input:checked + span { background: rgba(52, 211, 153, .15);  border-color: var(--yes);   color: var(--yes); }
        .choice.maybe input:checked + span { background: rgba(251, 191, 36, .15);  border-color: var(--maybe); color: var(--maybe); }
        .choice.no    input:checked + span { background: rgba(248, 113, 113, .15); border-color: var(--no);    color: var(--no); }
        .choice input:focus-visible + span { box-shadow: 0 0 0 3px rgba(139, 92, 246, .35); }

        /* Shareable links */
        .link-box {
            display: flex;
            align-items: center;
            gap: .6rem;
            margin: .4rem 0 0;
            padding: .6rem .9rem;
            background: rgba(0, 0, 0, .30);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: .85rem;
        }
        .link-box a {
            flex: 1;
            color: var(--text);
            text-decoration: none;
            word-break: break-all;
        }
        .link-box a:hover { color: var(--pink); }

        /* Response stats + table */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: .75rem;
            margin-top: 1.25rem;
        }
        .stat {
            padding: 1rem;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .stat b { display: block; font-size: 1.7rem; letter-spacing: -.02em; }
        .stat span { color: var(--muted); font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; }
        .stat.yes b   { color: var(--yes); }
        .stat.maybe b { color: var(--maybe); }
        .stat.no b    { color: var(--no); }

        table { width: 100%; border-collapse: collapse; }
        th {
            padding: .55rem .75rem;
            text-align: left;
            font-size: .72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .12em;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
        }
        td { padding: .7rem .75rem; border-bottom: 1px solid rgba(255, 255, 255, .05); }
        tr:last-child td { border-bottom: none; }

        .center { text-align: center; }
        .big-emoji { font-size: 3rem; line-height: 1; margin: 0 0 .5rem; }
        .back { margin-top: 1.5rem; }
    </style>
</head>
<body>
    <div class="bg-glow" aria-hidden="true"></div>
    <header class="site-header">
        <a class="brand" href="/"><span class="brand-mark">🎉</span> RSVP</a>
        {% block header_actions %}{% endblock %}
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
        function copyLink(btn, text) {
            const done = () => {
                const old = btn.textContent;
                btn.textContent = 'Copied ✓';
                setTimeout(() => { btn.textContent = old; }, 1500);
            };
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(done);
            } else {
                // Fallback for plain-http deployments where the
                // Clipboard API is unavailable.
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                done();
            }
        }
    </script>
</body>
</html>
