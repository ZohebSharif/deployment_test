{% extends "base.html" %}
{% block title %}Thanks{% endblock %}
{% block content %}
<div class="card center">
    <p class="big-emoji">{% if response == 'Yes' %}🎉{% elif response == 'Maybe' %}🤔{% else %}💌{% endif %}</p>
    <h1>Thanks for responding!</h1>
    <p class="lead">
        You replied <span class="badge {{ response|lower }}">{{ response }}</span>
        to <strong>{{ event.name }}</strong>.
    </p>
    <p><a class="btn btn-ghost" href="/rsvp/{{ event.slug }}">Change your response</a></p>
</div>
{% endblock %}
