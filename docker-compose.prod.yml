# Production compose: app + nginx only, backed by the managed RDS Postgres.
# There is intentionally no local `db` service here — the database is RDS.
#
# Usage on the server (EC2):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Requires a .env file next to this one (see .env.prod.example) holding the
# RDS connection details. docker compose reads .env automatically.
services:
  app:
    build: .
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE:-require}
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips="*"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app
    restart: unless-stopped
